services:
  api:
    build: ./backend
    volumes:
      - ./data:/data:ro           # source CSVs (read-only)
      - flags:/var/lib/fairtoy    # SQLite with flags survives restarts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ./frontend
    ports:
      - "${PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  flags:
